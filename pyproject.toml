[project]
name = "mbse-to-executable-spec-test"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "behave>=1.3.3",
    "mcp>=2.3.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "specs/steps"]

[tool.pyright]
extraPaths = ["tools", "specs/steps"]

[tool.ruff]
src = ["tools", "specs/steps"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
